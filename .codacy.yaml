---
# Java glob syntax: "**/" requires a separator before the directory, so it never covers the repository root - each excluded directory needs both forms
exclude_paths:
  - "public/**"
  - "**/public/**"
  - "tests/**"
  - "**/tests/**"
  - "vendor/**"
  - "**/vendor/**"
  - ".phpunit.cache/**"
  - "**.min.js"
  - "**.min.css"
  - "**.map"
  - "**.tpl.php"
